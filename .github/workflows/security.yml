name: "Security"
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  workflow_dispatch:

# Least privilege by default; jobs opt into more where needed.
permissions:
  contents: read

jobs:
  # Lints workflow files for bugs and shell-injection patterns.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@v2

  # GitHub Actions security auditor (unpinned actions, injection, over-broad perms).
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: zizmor
        uses: zizmorcore/zizmor-action@v0.6.0

  # Checks the locked Ruby gems against known CVEs.
  bundler-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Audit Ruby dependencies
        run: |
          gem install bundler-audit
          bundle-audit check --update

  # Scans the full git history for committed secrets.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so gitleaks can scan past commits

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
